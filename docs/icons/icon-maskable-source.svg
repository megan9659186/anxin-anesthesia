<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-230 -200 1484 1484" width="1024" height="1024">
  <!-- 安心麻醉島 App 圖示：麻醉醫師與小病人握手，底圖為淡化的慈濟蓮花標誌，底部文字「花慈麻醉安心手術」 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf4fd"/>
      <stop offset=".62" stop-color="#f6f1fb"/>
      <stop offset="1" stop-color="#fff6ea"/>
    </linearGradient>
    <pattern id="stripe" patternUnits="userSpaceOnUse" width="22" height="22">
      <rect width="22" height="22" fill="#b7d0e2"/><path d="M6 0V22" stroke="#f9fcfb" stroke-width="8"/><path d="M18 0V22" stroke="#87abc7" stroke-width="3"/>
    </pattern>
  </defs>
  <rect x="-230" y="-200" width="1484" height="1484" fill="url(#bg)"/>
  <!-- 淡化的慈濟蓮花底圖 -->
  <image href="tzuchi-logo-clear.png" xlink:href="tzuchi-logo-clear.png" x="2" y="20" width="1020" height="760" opacity=".2" preserveAspectRatio="xMidYMid meet"/>
  <g transform="translate(515 772) scale(1.24) translate(-515 -772)">
  <!-- 地面陰影 -->
  <ellipse cx="512" cy="760" rx="330" ry="34" fill="#7a6a9a" opacity=".14"/>

  <!-- 麻醉醫師（左） -->
  <g transform="translate(340 0)">
    <path d="M-38 610v140M38 610v140" stroke="#4f8f86" stroke-width="56" stroke-linecap="round"/>
    <path d="M-60 752h48M12 752h48" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
    <path d="M-104 470q104-62 208 0l-8 170h-192Z" fill="#6fb3a6"/>
    <path d="M-40 452L0 512 40 452" fill="none" stroke="#e6f5f1" stroke-width="10"/>
    <!-- 聽診器 -->
    <path d="M-50 468q-18 70 20 96 40 20 52-26" fill="none" stroke="#3d5f78" stroke-width="8" stroke-linecap="round"/>
    <circle cx="22" cy="536" r="14" fill="#cfe3ef" stroke="#3d5f78" stroke-width="6"/>
    <!-- 左手（垂下） -->
    <path d="M-96 480l-30 120" stroke="#6fb3a6" stroke-width="44" stroke-linecap="round"/>
    <circle cx="-128" cy="612" r="22" fill="#f2cfad"/>
    <!-- 右手伸向小病人 -->
    <path d="M90 490l80 60" stroke="#6fb3a6" stroke-width="44" stroke-linecap="round"/>
    <!-- 頭 -->
    <circle cx="0" cy="370" r="92" fill="#f2cfad"/>
    <path d="M-94 366q0-112 94-112 94 0 94 112Z" fill="#5aa79a"/>
    <path d="M-94 366h188" stroke="#4f8f86" stroke-width="10"/>
    <circle cx="-32" cy="384" r="10" fill="#3b2f2f"/><circle cx="32" cy="384" r="10" fill="#3b2f2f"/>
    <path d="M-28 420q28 24 56 0" fill="none" stroke="#a16c56" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-56" cy="412" r="13" fill="#f7a8b8" opacity=".6"/><circle cx="56" cy="412" r="13" fill="#f7a8b8" opacity=".6"/>
    <!-- 口罩掛在下巴 -->
    <path d="M-44 448h88v14q-44 22-88 0Z" fill="#e8f4fb" stroke="#a9cfe0" stroke-width="4"/>
  </g>

  <!-- 小病人（右） -->
  <g transform="translate(690 0)">
    <path d="M-30 560v188M30 560v188" stroke="url(#stripe)" stroke-width="46" stroke-linecap="round"/>
    <path d="M-50 752h40M10 752h40" stroke="#597380" stroke-width="22" stroke-linecap="round"/>
    <!-- 小病人和麻醉醫師一樣高：身體與頭往上移 80 -->
    <g transform="translate(0 -80)">
    <path d="M-86 520q86-60 172 0l-8 140h-156Z" fill="url(#stripe)" stroke="#7e9eb7" stroke-width="5"/>
    <path d="M-34 508L0 556 34 508M0 556V650" fill="none" stroke="#f4fafb" stroke-width="7"/>
    <!-- 右手垂下 -->
    <path d="M80 530l22 100" stroke="url(#stripe)" stroke-width="38" stroke-linecap="round"/>
    <circle cx="104" cy="640" r="19" fill="#f2cfad"/>
    <!-- 頭 -->
    <circle cx="0" cy="430" r="80" fill="#f2cfad"/>
    <path d="M-80 426q-4-110 80-94 98 0 80 102l-32-50q-80 42-118 14Z" fill="#48685a"/>
    <circle cx="-28" cy="440" r="9" fill="#284c47"/><circle cx="28" cy="440" r="9" fill="#284c47"/>
    <path d="M-22 474q22 20 44 0" fill="none" stroke="#a16c56" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-48" cy="466" r="12" fill="#f7a8b8" opacity=".6"/><circle cx="48" cy="466" r="12" fill="#f7a8b8" opacity=".6"/>
    </g>
    <!-- 左手伸向醫師握手 -->
    <path d="M-74 470l-90 82" stroke="url(#stripe)" stroke-width="38" stroke-linecap="round"/>
  </g>

  <!-- 握手 -->
  <g>
    <ellipse cx="520" cy="560" rx="40" ry="28" fill="#f2cfad" stroke="#d9a983" stroke-width="5"/>
    <path d="M492 548q26-12 54 0M494 568q26-10 50 2" fill="none" stroke="#d9a983" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- 小愛心 -->
  <path d="M520 470c-26-22-18-46 0-34 18-12 26 12 0 34Z" fill="#f08aa8" stroke="#d2557f" stroke-width="4"/>

  </g>
  <!-- 底部文字 -->
  <rect x="92" y="808" width="840" height="150" rx="75" fill="#ffffff" stroke="#e6a9bf" stroke-width="6"/>
  <text x="512" y="912" text-anchor="middle" font-family="WenQuanYi Zen Hei, PingFang TC, Noto Sans TC, sans-serif" font-size="94" font-weight="700" fill="#5a3f6e" letter-spacing="2">花慈麻醉安心手術</text>
</svg>
